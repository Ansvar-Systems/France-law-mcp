schema_version: '1.0'
mcp_name: 'French Law MCP'
jurisdiction: 'FR'

sources:
  - name: 'Legifrance'
    authority: 'DILA (Direction de linformation legale et administrative)'
    official_portal: 'https://www.legifrance.gouv.fr'
    canonical_identifier: 'NOR number or article reference (e.g., "Article L. 1332-1 du Code de la defense")'
    retrieval_method: 'API'
    api_documentation: 'https://piste.gouv.fr/'
    update_frequency: 'daily'
    last_ingested: '2026-02-16'
    license_or_terms:
      type: 'Licence Ouverte v2.0'
      url: 'https://www.etalab.gouv.fr/licence-ouverte-open-licence/'
      summary: 'French government open data license, free to use with attribution'
    coverage:
      scope: 'All consolidated French codes and laws from LEGI open data'
      limitations: 'Full corpus coverage — all codes and consolidated laws (TNC) from DILA LEGI archive'
    languages:
      - 'fr'

data_freshness:
  automated_checks: true
  check_frequency: 'daily'
  last_verified: '2026-02-16'

# Fix-Sweep rebuild contract (chassis corpus freshness automation, 2026-06-10 survey).
# Schema: Ansvar-Architecture-Documentation/infrastructure/policy/rebuild-contract.schema.json
# Runbook: Ansvar-Architecture-Documentation/docs/runbooks/fix-sweep.md
rebuild_contract:
  schema_version: "1.0"
  runnable: true
  ingest_cmd: "npm run ingest:legi"
  build_cmd: "npm run build:db"
  build_cwd: "."
  premium_build_cmd: null
  output_db: "data/database.db"
  schema_kind: "statute"
  drift_cmd: "npm run drift:detect"
  golden_hashes: "fixtures/golden-hashes.json"
  node_version: "22"
